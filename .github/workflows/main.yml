name: Build AndKittyInjector

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r25c
        add-to-path: true

    - name: Clean previous build
      run: |
        rm -rf ${{ github.workspace }}/obj
        rm -rf ${{ github.workspace }}/libs

    - name: Verify sys/uio.h include
      run: |
        if ! grep -q "sys/uio.h" ${{ github.workspace }}/AndKittyInjector/src/main.cpp; then
          echo "::error::sys/uio.h not found in main.cpp"
          exit 1
        fi

    - name: Build with ndk-build
      run: |
        ndk-build \
          NDK_PROJECT_PATH=${{ github.workspace }}/AndKittyInjector \
          APP_BUILD_SCRIPT=${{ github.workspace }}/AndKittyInjector/Android.mk \
          NDK_APPLICATION_MK=${{ github.workspace }}/AndKittyInjector/Application.mk \
          NDK_OUT=${{ github.workspace }}/obj \
          NDK_LIBS_OUT=${{ github.workspace }}/libs \
          APP_ABI=arm64-v8a
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndKittyInjector-arm64
        path: libs/arm64-v8a/AndKittyInjector
        if-no-files-found: error
